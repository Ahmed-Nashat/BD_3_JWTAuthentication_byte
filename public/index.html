<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vampire Token Auth</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #eef2ff; background: #101224; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #35245e, #101224 55%); }
      main { width: min(92vw, 880px); padding: 32px; }
      h1 { margin-bottom: 8px; } p { color: #c7cbe4; line-height: 1.5; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
      .card { background: #1a1d36; border: 1px solid #3a3e69; border-radius: 14px; padding: 20px; box-shadow: 0 16px 35px #05061066; }
      label { display: block; margin-top: 12px; font-weight: 700; } input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 11px; border: 1px solid #4d5180; border-radius: 8px; background: #0f1124; color: white; }
      button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 8px; background: #8355df; color: white; font-weight: 700; cursor: pointer; } button:hover { background: #956cf0; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .actions button { background: #2f3f88; }
      pre { overflow: auto; min-height: 96px; padding: 15px; border-radius: 10px; background: #090a16; color: #a7e3ff; white-space: pre-wrap; }
      .warning { color: #ffd47a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Vampire Token Authentication</h1>
      <p>Every JWT has 10 protected requests. The tenth request succeeds, then the token is revoked.</p>
      <div class="grid">
        <section class="card">
          <h2>Register</h2>
          <form id="register-form">
            <label>Name<input name="name" required minlength="2" /></label>
            <label>Email<input name="email" type="email" required /></label>
            <label>Password<input name="password" type="password" required minlength="8" /></label>
            <button>Create account</button>
          </form>
        </section>
        <section class="card">
          <h2>Login</h2>
          <form id="login-form">
            <label>Email<input name="email" type="email" required /></label>
            <label>Password<input name="password" type="password" required /></label>
            <button>Log in and receive token</button>
          </form>
          <p class="warning">The token is kept only in this page's memory, not local storage.</p>
        </section>
      </div>
      <section class="card" style="margin-top: 18px">
        <h2>Protected endpoint test</h2>
        <div class="actions"><button id="profile">Call profile</button><button id="admin">Call admin endpoint</button></div>
        <pre id="result">Register or log in to begin.</pre>
      </section>
    </main>
    <script>
      let token = "";
      const result = document.querySelector("#result");
      const show = (data) => (result.textContent = JSON.stringify(data, null, 2));
      const send = async (url, body) => {
        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        return response.json();
      };
      document.querySelector("#register-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        show(await send("/api/auth/register", Object.fromEntries(new FormData(event.target))));
      });
      document.querySelector("#login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = await send("/api/auth/login", Object.fromEntries(new FormData(event.target)));
        token = data.data?.token || "";
        show(data);
      });
      const protectedRequest = async (url) => {
        if (!token) return show({ success: false, msg: "Log in first" });
        const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const data = await response.json();
        data.tokenUsesRemaining = response.headers.get("X-Token-Uses-Remaining");
        show(data);
      };
      document.querySelector("#profile").addEventListener("click", () => protectedRequest("/api/auth/profile"));
      document.querySelector("#admin").addEventListener("click", () => protectedRequest("/api/auth/admin"));
    </script>
  </body>
</html>
